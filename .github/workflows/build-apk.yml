name: Build Seafile Manager APK
on:
  push:
    paths: ["SeafileManager/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Build release APK (debug-signiert)
        working-directory: SeafileManager
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SeafileManager-apk
          path: SeafileManager/app/build/outputs/apk/release/*.apk
